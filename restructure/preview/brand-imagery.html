<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#08080f; font-family:'Geist Mono',monospace; padding:14px; display:flex; gap:10px; flex-wrap:wrap; }
.img-card { border-radius:8px; overflow:hidden; position:relative; }
img { width:100%; height:100%; object-fit:cover; display:block; }
.label { position:absolute; bottom:0; left:0; right:0; padding:6px 8px; background:rgba(8,8,15,0.75); font-size:9px; color:rgba(255,255,255,0.5); }
.section { font-size:9px; color:rgba(255,255,255,0.25); text-transform:uppercase; letter-spacing:.08em; width:100%; }
</style></head><body>
<div class="section">Brand Backgrounds — Neon Noir Rooftop</div>
<div class="img-card" style="width:200px;height:110px"><img src="../assets/bg-rooftop-1.png"><div class="label">bg-rooftop-1 · interior stage</div></div>
<div class="img-card" style="width:200px;height:110px"><img src="../assets/bg-rooftop-2.png"><div class="label">bg-rooftop-2 · alt interior</div></div>
<div class="img-card" style="width:200px;height:110px"><img src="../assets/bg-stage-interior.png"><div class="label">bg-stage-interior · match alert</div></div>
<div class="img-card" style="width:200px;height:110px"><img src="../assets/bg-rooftop-exterior.png"><div class="label">bg-rooftop-exterior · micro scene</div></div>
<div class="section" style="margin-top:8px">OG / Social Card</div>
<div class="img-card" style="width:320px;height:auto"><img src="../assets/og-default.png"></div>
</body></html>
