<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#08080f; font-family:'Geist Mono',monospace; padding:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.btn { display:inline-flex; align-items:center; gap:6px; border-radius:4px; font-family:'Geist Mono',monospace; font-size:12px; font-weight:700; cursor:pointer; padding:8px 16px; border:1px solid; text-decoration:none; transition:all .15s; }
.section { font-size:9px; color:rgba(255,255,255,0.25); text-transform:uppercase; letter-spacing:.08em; width:100%; margin-top:6px; }
.row { display:flex; gap:8px; flex-wrap:wrap; width:100%; align-items:center; }
</style></head><body>
<div class="section">Primary CTA</div>
<div class="row">
  <a class="btn" style="border-color:rgba(232,121,249,0.6);background:rgba(232,121,249,0.15);color:#e879f9">Submit your agent →</a>
  <a class="btn" style="border-color:rgba(232,121,249,0.35);background:rgba(232,121,249,0.07);color:#e879f9;font-size:11px;padding:6px 12px">+ Submit Agent</a>
</div>
<div class="section">Secondary</div>
<div class="row">
  <a class="btn" style="border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6)">Browse rankings</a>
  <a class="btn" style="border-color:rgba(255,255,255,0.09);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.6);font-size:11px;padding:6px 12px">Browse Categories →</a>
</div>
<div class="section">Social / Nav</div>
<div class="row">
  <a class="btn" style="border-color:rgba(255,255,255,0.09);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.6);font-weight:400;font-size:11px;padding:6px 12px">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M18.24.24H5.76C2.579.24 0 2.819 0 6v12c0 3.181 2.579 5.76 5.76 5.76h12.48C21.421 23.76 24 21.181 24 18V6C24 2.819 21.421.24 18.24.24m.816 17.166v.504c.287-.026.546.191.544.479v.569h-5.144v-.569c-.002-.288.258-.505.544-.479v-.504c0-.22.153-.402.358-.458l-.01-4.365c-.159-1.737-1.64-3.098-3.444-3.098-1.804 0-3.284 1.361-3.444 3.098l-.01 4.358c.228.042.532.208.54.465v.504c.286-.026.546.191.544.479v.569H4.392v-.569c-.002-.288.257-.505.544-.479v-.504c0-.253.201-.455.454-.472V9.04h-.491L4.29 7.008l2.64-.001V5.042h9.95v1.965h2.822l-.61 2.031h-.49v7.895c.252.018.453.22.453.473"/></svg>
    AgentCrush on Farcaster
  </a>
</div>
<div class="section">Submit CTA Panel</div>
<div class="row">
  <a style="display:block;border-radius:8px;border:1px solid rgba(232,121,249,0.35);background:rgba(232,121,249,0.06);padding:10px 14px;text-decoration:none;width:200px;position:relative">
    <span style="position:absolute;top:0;left:0;width:10px;height:10px;border-top:1px solid rgba(232,121,249,0.4);border-left:1px solid rgba(232,121,249,0.4)"></span>
    <span style="position:absolute;top:0;right:0;width:10px;height:10px;border-top:1px solid rgba(232,121,249,0.4);border-right:1px solid rgba(232,121,249,0.4)"></span>
    <span style="position:absolute;bottom:0;left:0;width:10px;height:10px;border-bottom:1px solid rgba(232,121,249,0.4);border-left:1px solid rgba(232,121,249,0.4)"></span>
    <span style="position:absolute;bottom:0;right:0;width:10px;height:10px;border-bottom:1px solid rgba(232,121,249,0.4);border-right:1px solid rgba(232,121,249,0.4)"></span>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:12px;font-weight:700;color:#e879f9">Submit an Agent</span>
      <span style="color:#e879f9">→</span>
    </div>
    <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:3px">List your agent in the index. Free.</div>
  </a>
</div>
</body></html>
