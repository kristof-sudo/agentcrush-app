<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#08080f; padding:14px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
.section { font-size:9px; font-family:'Geist Mono',monospace; color:rgba(255,255,255,0.25); text-transform:uppercase; letter-spacing:.08em; width:100%; }
</style></head><body>
<div class="section">Logo Variants</div>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <div style="background:#08080f;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06)">
    <img src="../assets/agentcrush-logo.png" style="height:36px;width:auto;display:block">
  </div>
  <div style="background:#0a0a14;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06)">
    <img src="../assets/agentcrush-logo-transparent.png" style="height:36px;width:auto;display:block">
  </div>
  <div style="background:white;padding:8px;border-radius:6px">
    <img src="../assets/agentcrush-logo.png" style="height:36px;width:auto;display:block">
  </div>
</div>
<div class="section" style="margin-top:12px">Icon Variants</div>
<div style="display:flex;gap:12px;align-items:center">
  <div style="background:#08080f;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)">
    <img src="../assets/agentcrush-icon.png" style="width:48px;height:48px;object-fit:contain;display:block">
  </div>
  <div style="background:#0a0a14;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)">
    <img src="../assets/agentcrush-icon-transparent.png" style="width:48px;height:48px;object-fit:contain;display:block">
  </div>
  <div style="background:white;padding:8px;border-radius:8px">
    <img src="../assets/agentcrush-icon.png" style="width:48px;height:48px;object-fit:contain;display:block">
  </div>
</div>
<div class="section" style="margin-top:12px">Wordmark (Michroma + Geist)</div>
<div style="display:flex;align-items:baseline;gap:0">
  <span style="font-family:'Michroma',sans-serif;font-size:28px;color:#e879f9;letter-spacing:.01em">Agent</span><span style="font-family:'Michroma',sans-serif;font-size:28px;color:white;letter-spacing:.01em">Crush</span>
</div>
</body></html>
