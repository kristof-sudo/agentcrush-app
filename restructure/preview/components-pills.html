<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#08080f; font-family:'Geist Mono',monospace; padding:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; }
.pill { display:inline-flex; align-items:center; padding:2px 8px; border-radius:4px; font-size:9px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; border:1px solid; line-height:1.6; }
.section { font-size:9px; color:rgba(255,255,255,0.25); text-transform:uppercase; letter-spacing:.08em; width:100%; margin-top:8px; }
.row { display:flex; gap:6px; flex-wrap:wrap; width:100%; align-items:center; }
</style></head><body>
<div class="section">Archetype Pills</div>
<div class="row">
  <span class="pill" style="border-color:rgba(232,121,249,0.4);color:#e879f9;background:rgba(232,121,249,0.08)">Researcher</span>
  <span class="pill" style="border-color:rgba(0,212,255,0.35);color:#00d4ff;background:rgba(0,212,255,0.06)">Ecosystem</span>
  <span class="pill" style="border-color:rgba(96,165,250,0.35);color:#60a5fa;background:rgba(96,165,250,0.07)">Builder</span>
  <span class="pill" style="border-color:rgba(167,139,250,0.35);color:#a78bfa;background:rgba(167,139,250,0.07)">Operator</span>
  <span class="pill" style="border-color:rgba(57,255,20,0.3);color:#39ff14;background:rgba(57,255,20,0.07)">Framework</span>
  <span class="pill" style="border-color:rgba(240,165,0,0.35);color:#f0a500;background:rgba(240,165,0,0.07)">Trader</span>
  <span class="pill" style="border-color:rgba(248,113,113,0.35);color:#f87171;background:rgba(248,113,113,0.07)">Rebel</span>
  <span class="pill" style="border-color:rgba(74,222,128,0.35);color:#4ade80;background:rgba(74,222,128,0.07)">Creator</span>
  <span class="pill" style="border-color:rgba(251,146,60,0.35);color:#fb923c;background:rgba(251,146,60,0.07)">Infra</span>
  <span class="pill" style="border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.04)">Developer</span>
</div>
<div class="section">Delta Badges</div>
<div class="row">
  <span style="border-radius:4px;border:1px solid rgba(57,255,20,0.25);background:rgba(57,255,20,0.08);padding:2px 8px;font-size:11px;font-weight:700;color:#39ff14;font-variant-numeric:tabular-nums">+40</span>
  <span style="border-radius:4px;border:1px solid rgba(57,255,20,0.25);background:rgba(57,255,20,0.08);padding:2px 8px;font-size:11px;font-weight:700;color:#39ff14;font-variant-numeric:tabular-nums">+37</span>
  <span style="border-radius:4px;border:1px solid rgba(57,255,20,0.25);background:rgba(57,255,20,0.08);padding:2px 8px;font-size:11px;font-weight:700;color:#39ff14;font-variant-numeric:tabular-nums">+21</span>
  <span style="border-radius:4px;border:1px solid rgba(248,113,113,0.25);background:rgba(248,113,113,0.08);padding:2px 8px;font-size:11px;font-weight:700;color:#f87171;font-variant-numeric:tabular-nums">−12</span>
  <span style="border-radius:4px;border:1px solid rgba(248,113,113,0.25);background:rgba(248,113,113,0.08);padding:2px 8px;font-size:11px;font-weight:700;color:#f87171;font-variant-numeric:tabular-nums">−5</span>
  <span style="border-radius:4px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);padding:2px 8px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.35);font-variant-numeric:tabular-nums">—</span>
</div>
<div class="section">Trending Header Badge</div>
<div class="row">
  <a style="display:inline-flex;align-items:center;gap:6px;border-radius:4px;border:1px solid rgba(57,255,20,0.25);background:rgba(57,255,20,0.06);padding:6px 12px;font-size:11px;color:rgba(255,255,255,0.7);text-decoration:none">
    <span style="font-weight:700;color:#39ff14">↑</span>
    <span>Autonolas Agents</span>
    <span style="font-weight:700;color:#39ff14;font-variant-numeric:tabular-nums">+40</span>
  </a>
</div>
</body></html>
