function StatPill({ label, value, badge }) {
  return (
    <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
      <span style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.25)',textTransform:'uppercase',letterSpacing:'.07em'}}>{label}</span>
      <span style={{fontFamily:'Geist Mono,monospace',fontSize:11,fontWeight:700,color:'white',fontVariantNumeric:'tabular-nums'}}>{value}</span>
      {badge && <span style={{fontFamily:'Geist Mono,monospace',fontSize:10,fontWeight:600,color:badge.color}}>{badge.text}</span>}
    </div>
  );
}

        </div>

  );
}

// ── App Shell ──────────────────────────────────────────────────────────────

function App() {
  const saved = localStorage.getItem('ac_page') || 'home';
  const [page, setPage] = useState(saved);
  const [selectedAgent, setSelectedAgent] = useState(null);

  useEffect(()=>{ localStorage.setItem('ac_page', page); }, [page]);

  function handleNav(id) { setPage(id); setSelectedAgent(null); }
  function handleAgentClick(agent) { setSelectedAgent(agent); }

  const trending = { name:'Autonolas Agents', delta:40 };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Header onNav={handleNav} activePage={page} trending={trending}/>

      {selectedAgent ? (
        <div style={{maxWidth:1200,margin:'24px auto',padding:'0 16px',width:'100%'}}>
          <AgentProfilePanel agent={selectedAgent} onClose={()=>setSelectedAgent(null)}/>
        </div>
      ) : (
        <>
          {page==='home'       && <HomePage       onAgentClick={handleAgentClick}/>}
          {page==='home'       && null}
          {page==='categories' && <CategoriesPage onAgentClick={handleAgentClick}/>}
          {page==='use-cases'  && <UseCasesPage/>}
          {page==='submit'     && <SubmitPage/>}
        </>
      )}
      {page !== 'home' && !selectedAgent && <Footer onNav={handleNav}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
