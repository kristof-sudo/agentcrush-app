/* ── LIVE DOT ── */

/* ── PARTICLES ── */
function Particles(){
  const canvasRef=useRef();
  useEffect(()=>{
    const c=canvasRef.current; if(!c)return;
    const ctx=c.getContext('2d');
    let W=c.width=window.innerWidth, H=c.height=window.innerHeight;
    const COLS=['#e879f9','#00d4ff','#39ff14','#a78bfa','#60a5fa'];
    const pts=Array.from({length:55},(_,i)=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.8+0.6,
      vy:-(Math.random()*0.4+0.15),
      vx:(Math.random()-0.5)*0.3,
      col:COLS[i%COLS.length],
      life:Math.random(),
      maxLife:Math.random()*0.6+0.4,
      glow:Math.random()*6+3,
    }));
    let raf;
    function draw(){
      ctx.clearRect(0,0,W,H);
      pts.forEach(p=>{
        p.life+=0.003;
        if(p.life>p.maxLife){p.life=0;p.x=Math.random()*W;p.y=H+10;}
        p.x+=p.vx; p.y+=p.vy;
        const alpha=Math.sin((p.life/p.maxLife)*Math.PI)*0.75;
        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.shadowBlur=p.glow*3;
        ctx.shadowColor=p.col;
        ctx.fillStyle=p.col;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      });
      raf=requestAnimationFrame(draw);
    }
    draw();
    const onResize=()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;};
    window.addEventListener('resize',onResize);
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',onResize);};
  },[]);
  return<canvas ref={canvasRef} style={{position:'fixed',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:1}}/>;
}

/* ── RAIN / MIST ── */
function HeroRain(){
  const canvasRef=useRef();
  useEffect(()=>{
    const c=canvasRef.current; if(!c)return;
    const ctx=c.getContext('2d');
    let W=c.width=c.offsetWidth, H=c.height=c.offsetHeight;
    const drops=Array.from({length:120},()=>({
      x:Math.random()*W,
      y:Math.random()*H,
      len:Math.random()*60+20,
      speed:Math.random()*2.5+1.2,
      opacity:Math.random()*0.12+0.03,
      width:Math.random()*0.6+0.2,
      col:Math.random()<0.15?'0,212,255':'255,255,255',
    }));
    // Mist blobs
    const mists=Array.from({length:5},(_,i)=>({
      x:Math.random()*W, y:Math.random()*H*0.7,
      r:Math.random()*180+80,
      vx:(Math.random()-.5)*0.15,
      vy:(Math.random()-.5)*0.08,
      opacity:Math.random()*0.04+0.02,
      col:i<2?'0,212,255':i<4?'167,139,250':'232,121,249',
    }));
    let raf;
    function draw(){
      ctx.clearRect(0,0,W,H);
      // mist
      mists.forEach(m=>{
        m.x+=m.vx; m.y+=m.vy;
        if(m.x<-m.r)m.x=W+m.r; if(m.x>W+m.r)m.x=-m.r;
        if(m.y<-m.r)m.y=H+m.r; if(m.y>H+m.r)m.y=-m.r;
        const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);
        g.addColorStop(0,`rgba(${m.col},${m.opacity})`);
        g.addColorStop(1,`rgba(${m.col},0)`);
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
      });
      // rain
      drops.forEach(d=>{
        d.y+=d.speed;
        if(d.y>H){ d.y=-d.len; d.x=Math.random()*W; }
        ctx.save();
        ctx.globalAlpha=d.opacity;
        ctx.strokeStyle=`rgba(${d.col},1)`;
        ctx.lineWidth=d.width;
        ctx.beginPath();
        ctx.moveTo(d.x,d.y);
        ctx.lineTo(d.x-d.speed*0.4,d.y+d.len);
        ctx.stroke();
        ctx.restore();
      });
      raf=requestAnimationFrame(draw);
    }
    draw();
    const onResize=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight;};
    window.addEventListener('resize',onResize);
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',onResize);};
  },[]);
  return<canvas ref={canvasRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:4}}/>;
}

/* ── ANIMATED COUNTER ── */
function Counter({target,duration=1800}){
  const [val,setVal]=useState(0);
  useEffect(()=>{
    let start=null,raf;
    function step(ts){
      if(!start)start=ts;
      const p=Math.min((ts-start)/duration,1);
      const ease=1-Math.pow(1-p,3);
      setVal(Math.round(ease*target));
      if(p<1)raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf);
  },[target]);
  return<>{val.toLocaleString()}</>;
}

/* ── RANKING ROW ── */
function RankRow({agent,delay=0,highlight}){
  const ac=AC(agent.arch);
  const [visible,setVisible]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{ if(e.isIntersecting){setTimeout(()=>setVisible(true),delay);obs.disconnect();}},{threshold:.1});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);

  return(
    <div ref={ref} className="rank-row" style={{
      display:'grid',gridTemplateColumns:'36px 1fr 70px 56px 86px 86px',
      gap:8,padding:'10px 14px',
      borderBottom:'1px solid rgba(255,255,255,0.05)',
      alignItems:'center',cursor:'pointer',
      borderLeft:agent.rank===1?'2px solid #e879f9':agent.rank===2?'2px solid rgba(57,255,20,0.5)':agent.rank===3?'2px solid rgba(0,212,255,0.4)':'2px solid transparent',
      opacity:visible?1:0,transform:visible?'none':'translateY(14px)',
      transition:'opacity .5s ease, transform .5s ease, background .15s',
      background:highlight?'rgba(0,212,255,0.035)':'transparent',
      boxShadow:agent.rank===1?'inset 0 0 60px rgba(232,121,249,0.04)':undefined,

    onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.03)'}}
    onMouseLeave={e=>{e.currentTarget.style.background=highlight?'rgba(0,212,255,0.035)':'transparent'}}
    >
      {/* Rank badge with color per position */}
      {(()=>{
        const isTop=agent.rank<=3;
        const rBg=agent.rank===1?'rgba(232,121,249,0.2)':agent.rank===2?'rgba(57,255,20,0.15)':agent.rank===3?'rgba(0,212,255,0.15)':'rgba(255,255,255,0.06)';

      })()}
      <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
        <div style={{width:32,height:32,borderRadius:5,flexShrink:0,background:avatarBg(agent.handle),display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'white',border:'1px solid rgba(255,255,255,0.1)',boxShadow:agent.rank<=3?`0 0 12px ${agent.rank===1?'rgba(232,121,249,0.3)':agent.rank===2?'rgba(57,255,20,0.25)':'rgba(0,212,255,0.25)'}`:undefined}}>{agent.name[0]}</div>
        <div style={{minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:3}}>
            <span style={{fontFamily:'Geist Mono,monospace',fontSize:12,fontWeight:600,color:'rgba(255,255,255,0.92)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{agent.name}</span>
            <span style={{width:5,height:5,borderRadius:'50%',background:'#4ade80',flexShrink:0,boxShadow:'0 0 5px #4ade80'}}/>
          </div>

/* ── SIGNAL FEED ── */
function SignalFeed(){
  const [rows,setRows]=useState(()=>SIGNAL_POOL.slice(0,8).map((s,i)=>({...s,id:i,ts:Date.now()-i*280000,fresh:false})));
  const idRef=useRef(100);

  useEffect(()=>{
    let idx=8;
    const t=setInterval(()=>{
      const s=SIGNAL_POOL[idx%SIGNAL_POOL.length];
      idx++;
      const newRow={...s,id:idRef.current++,ts:Date.now(),fresh:true};
      setRows(prev=>[newRow,...prev.slice(0,14)]);
      setTimeout(()=>setRows(prev=>prev.map(r=>r.id===newRow.id?{...r,fresh:false}:r)),800);
    },3200);
    return()=>clearInterval(t);
  },[]);

  function relTime(ts){
    const d=(Date.now()-ts)/1000;
    if(d<60)return`${Math.floor(d)}s ago`;
    if(d<3600)return`${Math.floor(d/60)}m ago`;
    return`${Math.floor(d/3600)}h ago`;
  }

  return(
    <div style={{borderRadius:8,border:'1px solid rgba(255,255,255,0.06)',background:'#0a0a14',position:'relative',overflow:'hidden'}}>
      <CA/>
      <div style={{display:'flex',alignItems:'center',gap:6,borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'8px 14px'}}>
        <span style={{fontSize:10,color:'#a78bfa'}}>⚡</span>
        <span style={{fontFamily:'Geist Mono,monospace',fontSize:11,fontWeight:700,color:'white'}}>SIGNAL FEED</span>
        <span style={{width:6,height:6,borderRadius:'50%',background:'#a78bfa',animation:'pulse 1.4s ease infinite',display:'inline-block',marginLeft:2}}/>
        <span style={{marginLeft:'auto',fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.2)'}}>{rows.length}</span>
      </div>
      <div style={{maxHeight:420,overflowY:'auto'}}>
        {rows.map(row=>(
          <div key={row.id} style={{
            display:'flex',alignItems:'flex-start',gap:9,padding:'8px 14px',
            borderBottom:'1px solid rgba(255,255,255,0.04)',
            animation:row.fresh?'newRow .5s ease both':'none',
            transition:'background .3s',
          }}>
            <span style={{marginTop:4,width:7,height:7,borderRadius:'50%',background:row.dot,boxShadow:`0 0 6px ${row.dot}`,display:'inline-block',flexShrink:0,animation:row.fresh?'ping .8s ease':'none'}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'baseline',gap:5,minWidth:0}}>
                <span style={{fontFamily:'Geist Mono,monospace',fontSize:11,fontWeight:600,color:'rgba(255,255,255,0.85)',flexShrink:0}}>{row.name}</span>
                <span style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{row.label}</span>
              </div>
              <div style={{display:'flex',gap:8,marginTop:2}}>
                <span style={{fontFamily:'Geist Mono,monospace',fontSize:9,fontWeight:600,color:row.dot}}>{row.type.replace(/_/g,' ')}</span>
                <span style={{fontFamily:'Geist Mono,monospace',fontSize:9,color:'rgba(255,255,255,0.2)'}}>{relTime(row.ts)}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── BIGGEST MOVERS ── */
function Movers(){
  const [agents,setAgents]=useState(()=>[...AGENTS].sort((a,b)=>b.delta-a.delta));
  useEffect(()=>{
    const t=setInterval(()=>{
      setAgents(prev=>prev.map(a=>{
        const jitter=Math.random()<0.25?(Math.random()<0.5?1:-1)*Math.floor(Math.random()*2):0;
        return jitter?{...a,delta:Math.max(1,a.delta+jitter)}:a;
      }).sort((a,b)=>b.delta-a.delta));
    },3500);
    return()=>clearInterval(t);
  },[]);
  return(
    <div style={{borderRadius:8,border:'1px solid rgba(255,255,255,0.06)',background:'#0a0a14',position:'relative',overflow:'hidden'}}>
      <CA/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'8px 14px'}}>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <span style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'#39ff14'}}>↑</span>
          <span style={{fontFamily:'Geist Mono,monospace',fontSize:11,fontWeight:700,color:'white'}}>BIGGEST MOVERS</span>
        </div>
        <span style={{fontFamily:'Geist Mono,monospace',fontSize:9,color:'rgba(255,255,255,0.2)'}}>7d delta</span>
      </div>
      {agents.map(a=>(
        <div key={a.id} className="mover-row" style={{display:'flex',alignItems:'center',gap:8,padding:'8px 14px',borderBottom:'1px solid rgba(255,255,255,0.04)',cursor:'pointer',transition:'background .12s',overflow:'hidden'}}
          onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.025)'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}
        >
          <div style={{width:28,height:28,borderRadius:4,flexShrink:0,background:avatarBg(a.handle),display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'white',border:'1px solid rgba(255,255,255,0.07)'}}>{a.name[0]}</div>

            <div style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.3)',fontVariantNumeric:'tabular-nums'}}>#{a.rank} · score {a.score}</div>
          </div>
          <span className="mover-delta" style={{borderRadius:4,border:'1px solid rgba(57,255,20,0.25)',background:'rgba(57,255,20,0.08)',padding:'2px 9px',fontSize:12,fontWeight:700,color:'#39ff14',fontVariantNumeric:'tabular-nums',transition:'all .3s',flexShrink:0,minWidth:52,textAlign:'center'}}>+{a.delta}</span>
        </div>
      ))}
    </div>
  );

                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5,padding:8}}>
                    {['awesome-llm-apps','career-ops','1Panel','firecrawl','goose','CowAgent','nanobot','Agentic-AI','genai-jobs','live','spm-agent','FastAgent'].map((n,i)=>(
                      <div key={n} style={{display:'flex',alignItems:'center',gap:6,borderRadius:4,border:'1px solid rgba(255,255,255,0.05)',background:'rgba(255,255,255,0.015)',padding:'5px 8px',cursor:'pointer',transition:'all .12s'}}
                        onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.04)';e.currentTarget.style.borderColor='rgba(255,255,255,0.1)'}}
                        onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.015)';e.currentTarget.style.borderColor='rgba(255,255,255,0.05)'}}
                      >
                        <div style={{width:18,height:18,borderRadius:3,flexShrink:0,background:avatarBg(n),display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:700,color:'white'}}>{n[0].toUpperCase()}</div>
                        <span style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.7)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{borderTop:'1px solid rgba(255,255,255,0.04)',padding:'4px 14px'}}>
                    <span style={{fontFamily:'Geist Mono,monospace',fontSize:9,color:'rgba(255,255,255,0.2)'}}>2h ago · latest</span>
                  </div>
                </div>

                {/* Submit + Follow */}
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  <a href="#" style={{
                    borderRadius:8,border:'1px solid rgba(232,121,249,0.4)',background:'rgba(232,121,249,0.07)',
                    padding:'14px',position:'relative',overflow:'hidden',display:'block',textDecoration:'none',cursor:'pointer',transition:'all .2s',
                    boxShadow:'0 0 30px rgba(232,121,249,0.04)',
                  }}
                  onMouseEnter={e=>{e.currentTarget.style.background='rgba(232,121,249,0.14)';e.currentTarget.style.boxShadow='0 0 40px rgba(232,121,249,0.12)'}}
                  onMouseLeave={e=>{e.currentTarget.style.background='rgba(232,121,249,0.07)';e.currentTarget.style.boxShadow='0 0 30px rgba(232,121,249,0.04)'}}
                  >
                    <CA/>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{fontFamily:'Geist Mono,monospace',fontSize:12,fontWeight:700,color:'#e879f9'}}>Submit an Agent</span>
                      <span style={{color:'#e879f9',fontSize:14}}>→</span>
                    </div>
                    <div style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.35)'}}>List your agent in the index. Free.</div>
                  </a>
                  <div style={{borderRadius:8,border:'1px solid rgba(255,255,255,0.05)',background:'#0a0a14',padding:'14px',position:'relative',overflow:'hidden'}}>
                    <CA c="rgba(0,212,255,0.3)"/>
                    <h2 style={{fontFamily:'Geist Mono,monospace',fontSize:12,fontWeight:700,color:'white',marginBottom:4}}>Follow the ecosystem</h2>
                    <p style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.35)',lineHeight:1.6,marginBottom:10}}>Track rank moves, new launches, and signal intelligence.</p>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      {['AgentCrush on Farcaster','Browse Categories →'].map(l=>(
                        <a key={l} href="#" style={{display:'inline-flex',alignItems:'center',borderRadius:4,border:'1px solid rgba(255,255,255,0.09)',background:'rgba(255,255,255,0.03)',padding:'5px 10px',fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.55)',textDecoration:'none',transition:'all .15s'}}
                          onMouseEnter={e=>{e.currentTarget.style.color='white';e.currentTarget.style.borderColor='rgba(255,255,255,0.18)'}}
                          onMouseLeave={e=>{e.currentTarget.style.color='rgba(255,255,255,0.55)';e.currentTarget.style.borderColor='rgba(255,255,255,0.09)'}}
                        >{l}</a>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Right col */}
            <div style={{display:'flex',flexDirection:'column',gap:12,position:'sticky',top:72}} className="right-col">
              <SignalFeed/>
              <Movers/>
            </div>
          </div>
        </div>
      </div>

      {/* Footer */}
      <footer style={{borderTop:'1px solid rgba(255,255,255,0.04)',padding:'16px 20px',textAlign:'center',position:'relative',zIndex:10}}>
        <p style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.2)'}}>© 2026 AgentCrush · The AI Agent Ecosystem Index</p>
        <div style={{marginTop:4,display:'flex',justifyContent:'center',gap:20}}>
          {['About','Terms'].map(l=><a key={l} href="#" style={{fontFamily:'Geist Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.2)',textDecoration:'none'}}>{l}</a>)}
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
